name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      DATABASE_URL: "file:./test.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run prisma:test
      - run: npm run prisma:test:push


      - name: Debug OIDC
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"
          echo "Ref: $GITHUB_REF"

      - run: npm run build
      - run: npm publish