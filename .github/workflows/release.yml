name: Release

# The normal path is dispatched by ci.yml after its quality gate already
# passed on a push to a version branch (v3.x, v2.x, ...), so it does not
# repeat the tests. A manual tag push runs the full gate itself first.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Manual-tag quality gate. The automatic path (ci.yml -> this workflow)
  # already passed this same matrix, so it is skipped there.
  ci:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # Must grant everything any job in ci.yml could request, including its
    # release job's contents:write/actions:write — GitHub validates that at
    # call time regardless of that job's own `if` (it never actually runs
    # here, since a tag push isn't github.event_name == 'push' on a branch).
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/ci.yml

  validate:
    name: validate release
    if: >-
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      name: ${{ steps.pkg.outputs.name }}
      should_publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Read package metadata
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Resolve release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publishing requires a version tag
        if: steps.mode.outputs.publish == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*.*.*) ;;
            *)
              echo "::error::Publishing must run from a version tag, got $GITHUB_REF"
              exit 1
              ;;
          esac

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Version must be valid semver
        run: |
          echo "${{ steps.pkg.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::Invalid semver: ${{ steps.pkg.outputs.version }}"; exit 1; }

      - name: CHANGELOG must mention this version
        run: |
          grep -q "\[${{ steps.pkg.outputs.version }}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for ${{ steps.pkg.outputs.version }}"; exit 1; }

      - name: Version must not already exist on npm
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published"
            exit 1
          fi

      - run: npm ci
      - run: npx prisma generate --schema=tests/prisma/schema.test.prisma
      - run: npm run build

      - name: Built output must exist
        run: |
          for f in dist/index.js dist/index.mjs dist/index.d.ts; do
            [ -s "$f" ] || { echo "::error::Missing build artifact: $f"; exit 1; }
          done

      - name: Package must be importable (CJS and ESM)
        run: |
          node -e "const m=require('./dist/index.js'); if(typeof m.configurePrisma!=='function') throw new Error('CJS export missing'); console.log('CJS ok');"
          node --input-type=module -e "import('./dist/index.mjs').then(m=>{if(typeof m.configurePrisma!=='function')throw new Error('ESM export missing');console.log('ESM ok')})"

      - name: Inspect the tarball (no source, no docs)
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const [p]=require('/tmp/pack.json');
            const files=p.files.map(f=>f.path);
            const leaked=files.filter(f=>/^(src|tests|docs|scripts)\//.test(f));
            if(leaked.length){console.error('Unexpected files in the package:',leaked);process.exit(1);}
            if(!files.some(f=>f.startsWith('dist/'))){console.error('No dist/ in the package');process.exit(1);}
            console.log('Tarball contents ok:',files.length,'files,',p.size,'bytes');
          "

  # Publish via npm trusted publishing (OIDC) — no long-lived npm token
  # stored in the repo. Requires the trusted publisher already registered on
  # npmjs.com for this exact package/org/repo/workflow/environment.
  publish:
    name: publish to npm
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    needs: validate
    # Ties this run to the repo's Environments/Deployments UI instead of just
    # showing up as a Release — gives a real deployment history and a spot
    # to add required reviewers later (Settings -> Environments -> npm).
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.validate.outputs.name }}/v/${{ needs.validate.outputs.version }}
    permissions:
      contents: write # to create the GitHub Release after a successful publish
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1. The npm bundled with the
      # runner's Node install can be older than that — it will happily sign
      # provenance but cannot exchange GitHub's OIDC token for a registry
      # credential, so it must be upgraded explicitly before publishing.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - run: npm ci
      - run: npx prisma generate --schema=tests/prisma/schema.test.prisma
      - run: npm run build

      # Decided before publishing and handed straight to `npm publish --tag`,
      # instead of publishing first and correcting the tag with a separate
      # `npm dist-tag add` afterward. That used to be two steps (one for
      # 'latest', one for 'vNx') and both 401'd the first time this ran on
      # OIDC: the short-lived credential `npm publish --provenance` gets from
      # the OIDC id-token is scoped to that one publish call and does not
      # carry over to a later, separate registry-write call in the same job.
      # Setting the tag at publish time needs no extra credential at all, so
      # NPM_TOKEN is no longer needed anywhere in this file — confirmed by
      # this working end to end.
      #
      # The highest-numbered major always gets 'latest', full stop — never
      # its own 'vNx' tag, since 'latest' already serves that purpose. Only a
      # major that is NOT the current highest gets tagged 'vNx', so
      # `npm install @didactika/prisma-entity@v2x` keeps resolving to the
      # newest 2.x patch on its own, independent of whatever 3.x does. No dot
      # in the tag name on purpose: npm's own arg parsing treats a bare
      # "v2.x" as a semver range (>=2.0.0 <3.0.0) before it ever considers
      # dist-tags, which would silently bypass this tag rather than use it.
      - name: Determine npm dist-tag
        id: npm-tag
        if: needs.validate.outputs.should_publish == 'true'
        env:
          PKG: ${{ needs.validate.outputs.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          HIGHEST=$(npm view "$PKG" versions --json 2>/dev/null | node -e "
            let data = [];
            try { data = JSON.parse(require('fs').readFileSync(0, 'utf8')); } catch {}
            data = [].concat(data).filter(Boolean);
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
              return 0;
            };
            console.log(data.sort(cmp).pop() ?? '');
          ")

          IS_HIGHEST=$(node -e "
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
              return 0;
            };
            const [version, highest] = process.argv.slice(1);
            console.log(!highest || cmp(version, highest) >= 0);
          " "$VERSION" "$HIGHEST")

          echo "Highest published so far: ${HIGHEST:-none yet} — publishing: $VERSION"
          if [ "$IS_HIGHEST" = "true" ]; then
            echo "New overall highest — tag: latest"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_highest=true" >> "$GITHUB_OUTPUT"
          else
            MAJOR="${VERSION%%.*}"
            MAJOR_TAG="v${MAJOR}x"
            echo "Patch on an older, non-highest major — tag: $MAJOR_TAG (never touches latest)"
            echo "tag=$MAJOR_TAG" >> "$GITHUB_OUTPUT"
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
          fi

      # Authentication is exclusively OIDC trusted publishing. Do not add a
      # NODE_AUTH_TOKEN / NPM_TOKEN env var back here.
      - name: Publish
        if: needs.validate.outputs.should_publish == 'true'
        run: npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }} --provenance

      - name: Dry run
        if: needs.validate.outputs.should_publish == 'false'
        run: npm publish --access public --dry-run

      - name: Extract CHANGELOG section for this version
        if: needs.validate.outputs.should_publish == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' > /tmp/release-notes.md
          echo "Extracted $(wc -l < /tmp/release-notes.md) line(s) from CHANGELOG.md for $VERSION"

      - name: Create GitHub Release
        if: needs.validate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
          IS_HIGHEST: ${{ steps.npm-tag.outputs.is_highest }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $VERSION_TAG already exists"
          elif [ -s /tmp/release-notes.md ]; then
            # CHANGELOG.md has a matching "## [x.y.z]" section — use it verbatim as the release body.
            gh release create "$VERSION_TAG" \
              --verify-tag \
              --title "$VERSION_TAG" \
              --notes-file /tmp/release-notes.md \
              --latest="$IS_HIGHEST"
          else
            # No matching section (shouldn't happen — validate already requires one) — fall back.
            gh release create "$VERSION_TAG" \
              --verify-tag \
              --title "$VERSION_TAG" \
              --generate-notes \
              --latest="$IS_HIGHEST"
          fi

      - name: Published summary
        if: needs.validate.outputs.should_publish == 'true'
        run: |
          echo "### Published \`${{ needs.validate.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/${{ needs.validate.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: needs.validate.outputs.should_publish == 'false'
        run: echo "### Dry run completed for \`${{ needs.validate.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
