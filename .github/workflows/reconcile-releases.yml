name: Reconcile releases

# On-demand consistency check + fix for npm dist-tags and the GitHub Release
# "Latest" badge. Every correction here is idempotent — safe to run anytime,
# it no-ops if things are already correct. Needed as a separate, manually
# triggerable workflow because it's the org's NPM_TOKEN doing the work, not
# a maintainer's own npm login (most maintainers aren't npm owners on this
# package).
on:
  workflow_dispatch:

jobs:
  reconcile:
    name: reconcile npm dist-tags and GitHub Releases
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/prisma-entity-framework
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Read package name
        id: pkg
        run: echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Correct npm dist-tags (latest + one per major line)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG: ${{ steps.pkg.outputs.name }}
        run: |
          VERSIONS_JSON=$(npm view "$PKG" versions --json)
          DIST_TAGS_JSON=$(npm view "$PKG" dist-tags --json)

          HIGHEST=$(echo "$VERSIONS_JSON" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
              return 0;
            };
            console.log([].concat(data).sort(cmp).pop());
          ")

          CURRENT_LATEST=$(echo "$DIST_TAGS_JSON" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(data.latest || '');
          ")

          echo "Highest published version: $HIGHEST (npm 'latest' currently: $CURRENT_LATEST)"
          if [ "$HIGHEST" != "$CURRENT_LATEST" ]; then
            echo "Correcting 'latest' -> $HIGHEST"
            npm dist-tag add "$PKG@$HIGHEST" latest
          fi

          # One vN.x dist-tag per major line ever published, so
          # `npm install prisma-entity-framework@v2.x` always resolves to
          # the newest 2.x patch regardless of what 'latest' points to.
          MAJORS=$(echo "$VERSIONS_JSON" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log([...new Set(data.map(v => v.split('.')[0]))].join(' '));
          ")

          for MAJOR in $MAJORS; do
            MAJOR_TAG="v${MAJOR}.x"

            HIGHEST_IN_MAJOR=$(echo "$VERSIONS_JSON" | MAJOR="$MAJOR" node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const inMajor = data.filter(v => v.split('.')[0] === process.env.MAJOR);
              const cmp = (a, b) => {
                const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
                for (let i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
                return 0;
              };
              console.log(inMajor.sort(cmp).pop());
            ")

            CURRENT_MAJOR_TAG=$(echo "$DIST_TAGS_JSON" | MAJOR_TAG="$MAJOR_TAG" node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              console.log(data[process.env.MAJOR_TAG] || '');
            ")

            echo "Highest published $MAJOR_TAG: $HIGHEST_IN_MAJOR (currently tagged: ${CURRENT_MAJOR_TAG:-<none>})"
            if [ "$HIGHEST_IN_MAJOR" != "$CURRENT_MAJOR_TAG" ]; then
              echo "Correcting $MAJOR_TAG -> $HIGHEST_IN_MAJOR"
              npm dist-tag add "$PKG@$HIGHEST_IN_MAJOR" "$MAJOR_TAG"
            fi
          done

      - name: Correct which GitHub Release is marked Latest
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ steps.pkg.outputs.name }}
        run: |
          HIGHEST=$(npm view "$PKG" versions --json | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
              return 0;
            };
            console.log([].concat(data).sort(cmp).pop());
          ")
          TAG="v$HIGHEST"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Marking $TAG as the Latest release"
            gh release edit "$TAG" --latest
          else
            echo "::warning::No GitHub Release found for the highest published version ($TAG) — nothing to mark Latest."
          fi
